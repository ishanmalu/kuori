name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15   # macos-14 ships Swift 5.10 and can't read a tools-version 6.0 manifest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Self-test
        run: swift run -c release Daisy --selftest
